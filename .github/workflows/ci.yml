name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root-ci-only
          MYSQL_DATABASE: intelly_gestor
          MYSQL_USER: intelly
          MYSQL_PASSWORD: intelly-ci-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot-ci-only"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DATABASE_URL: mysql://intelly:intelly-ci-only@127.0.0.1:3306/intelly_gestor
      MIGRATION_TEST_DATABASE_URL: mysql://root:root-ci-only@127.0.0.1:3306/mysql
      BOOTSTRAP_ADMIN_ENABLED: "false"
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
